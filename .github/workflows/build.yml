name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ github.token }}
      PYVER: "3.13"
    steps:
      - uses: actions/checkout@v4

      - name: Download Python for iOS (BeeWare)
        run: |
          TAG=$(gh release list --repo beeware/Python-Apple-support --limit 40 \
                --json tagName -q '.[].tagName' | grep "^${PYVER}-" | head -1)
          echo "Using tag: $TAG"
          gh release download "$TAG" --repo beeware/Python-Apple-support \
            --pattern "Python-${PYVER}-iOS-support.*.tar.gz"
          tar -xzf Python-${PYVER}-iOS-support.*.tar.gz
          ls

      - name: Copy stdlib into app resources
        run: |
          mkdir -p python
          cp -R Python.xcframework/ios-arm64/lib python/lib
          ls python/lib

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project PyRun.xcodeproj -scheme PyRun \
            -sdk iphoneos -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PyRun.app Payload/
          zip -qry PyRun.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PyRun-ipa
          path: PyRun.ipa
