name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ github.token }}
      PYVER: "3.13"
    steps:
      - uses: actions/checkout@v4

      - name: Download Python for iOS (BeeWare)
        run: |
          set -e
          TAG=$(gh release list --repo beeware/Python-Apple-support --limit 40 \
                --json tagName -q '.[].tagName' | grep "^${PYVER}-" | head -1)
          [ -n "$TAG" ] || { echo "Không tìm thấy release Python ${PYVER}"; exit 1; }
          echo "Using tag: $TAG"
          gh release download "$TAG" --repo beeware/Python-Apple-support \
            --pattern "Python-${PYVER}-iOS-support.*.tar.gz"
          tar -xzf Python-${PYVER}-iOS-support.*.tar.gz
          XC=$(find . -maxdepth 3 -name Python.xcframework -type d | head -1)
          [ -n "$XC" ] || { echo "Không thấy Python.xcframework"; find . -maxdepth 3; exit 1; }
          [ "$XC" = "./Python.xcframework" ] || mv "$XC" ./Python.xcframework
          find Python.xcframework -maxdepth 3

      - name: Copy stdlib into app resources
        run: |
          set -e
          echo "=== cấu trúc xcframework ==="
          find Python.xcframework -maxdepth 4 -type d | head -80
          OS=$(find Python.xcframework -path '*/python3.*/os.py' -not -path '*site-packages*' | head -1)
          [ -n "$OS" ] || { echo "Không thấy os.py trong xcframework"; exit 1; }
          STD=$(dirname "$OS"); VER=$(basename "$STD")
          echo "Stdlib: $STD ($VER)"
          mkdir -p python/lib
          cp -R "$STD" "python/lib/$VER"
          DYN=$(find Python.xcframework -type d -name lib-dynload -path '*/ios-arm64/*' | head -1)
          echo "Dynload: $DYN"
          if [ -n "$DYN" ]; then
            mkdir -p "python/lib/$VER/lib-dynload"
            cp -R "$DYN"/. "python/lib/$VER/lib-dynload/"
          fi
          ls "python/lib/$VER" | head -20
          test -f "python/lib/$VER/os.py"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project PyRun.xcodeproj -scheme PyRun \
            -sdk iphoneos -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PyRun.app Payload/
          cp -R python Payload/PyRun.app/python
          ls Payload/PyRun.app/Frameworks
          ls Payload/PyRun.app/python/lib
          zip -qry PyRun.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PyRun-ipa
          path: PyRun.ipa
