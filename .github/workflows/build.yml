name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ github.token }}
      PYVER: "3.13"
    steps:
      - uses: actions/checkout@v4

      - name: Download Python for iOS (BeeWare)
        run: |
          set -e
          TAG=$(gh release list --repo beeware/Python-Apple-support --limit 40 \
                --json tagName -q '.[].tagName' | grep "^${PYVER}-" | head -1)
          [ -n "$TAG" ] || { echo "Không tìm thấy release Python ${PYVER}"; exit 1; }
          echo "Using tag: $TAG"
          gh release download "$TAG" --repo beeware/Python-Apple-support \
            --pattern "Python-${PYVER}-iOS-support.*.tar.gz"
          tar -xzf Python-${PYVER}-iOS-support.*.tar.gz
          XC=$(find . -maxdepth 3 -name Python.xcframework -type d | head -1)
          [ -n "$XC" ] || { echo "Không thấy Python.xcframework"; find . -maxdepth 3; exit 1; }
          [ "$XC" = "./Python.xcframework" ] || mv "$XC" ./Python.xcframework
          find Python.xcframework -maxdepth 3

      - name: Copy stdlib into app resources
        run: |
          set -e
          echo "=== cấu trúc xcframework ==="
          find Python.xcframework -maxdepth 4 -type d | head -80
          OS=$(find Python.xcframework -path '*/python3.*/os.py' -not -path '*site-packages*' | head -1)
          [ -n "$OS" ] || { echo "Không thấy os.py trong xcframework"; exit 1; }
          STD=$(dirname "$OS"); VER=$(basename "$STD")
          echo "Stdlib: $STD ($VER)"
          mkdir -p python/lib
          cp -R "$STD" "python/lib/$VER"
          DYN=$(find Python.xcframework -type d -name lib-dynload -path '*/ios-arm64/*' | head -1)
          echo "Dynload: $DYN"
          if [ -n "$DYN" ]; then
            mkdir -p "python/lib/$VER/lib-dynload"
            cp -R "$DYN"/. "python/lib/$VER/lib-dynload/"
          fi
          ls "python/lib/$VER" | head -20
          test -f "python/lib/$VER/os.py"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project PyRun.xcodeproj -scheme PyRun \
            -sdk iphoneos -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || STATUS=$?
          echo "=========== CÁC DÒNG LỖI ==========="
          grep -E "error:" build.log | sort -u | head -40 || true
          echo "===================================="
          exit ${STATUS:-0}

      - name: Package IPA
        run: |
          set -e
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PyRun.app Payload/
          APP=Payload/PyRun.app
          cp -R python "$APP/python"
          VER=$(ls "$APP/python/lib" | grep '^python3' | head -1)
          DYN="$APP/python/lib/$VER/lib-dynload"
          echo "Stdlib: $VER"
          mkdir -p "$APP/Frameworks"

          # Chuyển từng module C (.so) thành framework để iOS/Sideloadly ký được
          find "$DYN" -name '*.so' > so_list.txt
          COUNT=0
          while IFS= read -r SO; do
            REL="${SO#$DYN/}"
            NAME=$(echo "$REL" | cut -d. -f1 | tr '/' '.')
            FW="Frameworks/$NAME.framework"
            BID="com.minhhuy.pyrun.$(echo "$NAME" | tr '_' '-')"
            mkdir -p "$APP/$FW"
            cat > "$APP/$FW/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleExecutable</key><string>$NAME</string>
            <key>CFBundleIdentifier</key><string>$BID</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>$NAME</string>
            <key>CFBundlePackageType</key><string>FMWK</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>
            <key>CFBundleVersion</key><string>1</string>
            <key>MinimumOSVersion</key><string>17.0</string>
          </dict>
          </plist>
          PLIST
            mv "$SO" "$APP/$FW/$NAME"
            install_name_tool -id "@rpath/$FW/$NAME" "$APP/$FW/$NAME"
            echo "$FW/$NAME" > "${SO%.so}.fwork"
            FWORK="${SO%.so}.fwork"
            echo "${FWORK#$APP/}" > "$APP/$FW/$NAME.origin"
            COUNT=$((COUNT+1))
          done < so_list.txt
          echo "Đã chuyển $COUNT module thành framework"
          ls "$APP/Frameworks" | head -20
          ls "$DYN" | head -10
          cat "$DYN"/math.*.fwork

          zip -qry PyRun.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PyRun-ipa
          path: PyRun.ipa
