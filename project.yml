name: PyRun
options:
  bundleIdPrefix: com.minhhuy
  deploymentTarget:
    iOS: "17.0"
targets:
  PyRun:
    type: application
    platform: iOS
    sources:
      - path: PyRunApp.swift
    resources:
      - path: python
        type: folder
    dependencies:
      - framework: Python.xcframework
        embed: true
        codeSign: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: PyRun
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minhhuy.pyrun
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
